# TokenRank 服务端 · Kubernetes 部署清单（命名空间 ai-pj）
# 形态：Ingress（cert-manager 签发证书 + TLS 终止）→ Service(ClusterIP) → Node 单进程（自带静态分发）
# 部署：kubectl --kubeconfig=<kubeconfig> apply -f deploy/k8s/manifests.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tokenrank-data
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # 留空使用集群默认 StorageClass（nfs-storage）；SQLite 单副本写入，勿开多副本
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tokenrank-config
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
data:
  PORT: "8790"
  # TLS 在 Ingress 终止，集群内到 pod 是明文，故监听 0.0.0.0 并显式允许明文
  TOKENRANK_HOST: "0.0.0.0"
  TOKENRANK_ALLOW_INSECURE_HTTP: "1"
  TOKENRANK_DB: "/data/tokenrank.db"
  TOKENRANK_MAX_BODY_BYTES: "1048576"
  # 客户端接入地址：对外域名（生成安装命令用），不带端口
  PUBLIC_ORIGIN: "https://tokenrank.oortcloudsmart.com:2443"
  CORS_ORIGIN: ""
  # 飞书凭证请用 Secret 引用：FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_VERIFICATION_TOKEN / FEISHU_ENCRYPT_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenrank
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tokenrank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokenrank
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: init-db
          image: hb.oortcloudsmart.com/ai/tokenrank:1f7c215-b2
          command: ["node", "/app/server/init-db.mjs"]
          envFrom:
            - configMapRef:
                name: tokenrank-config
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: tokenrank
          image: hb.oortcloudsmart.com/ai/tokenrank:1f7c215-b2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8790
          envFrom:
            - configMapRef:
                name: tokenrank-config
          env:
            # 飞书机器人：长连接收事件 + 卡片发送。凭证走 Secret（见 README「启用飞书机器人」）
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: tokenrank-feishu
                  key: app-id
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: tokenrank-feishu
                  key: app-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tokenrank-data
---
apiVersion: v1
kind: Service
metadata:
  name: tokenrank
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tokenrank
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 命名空间自带 default-deny-all，且既有放行策略的 ipBlock 排除了 pod 网段（172.20.0.0/16），
# 因此 ingress-nginx 的 pod 访问不到本 pod。这里只为本应用放行一个来源+端口。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tokenrank-allow-ingress-nginx
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tokenrank
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8790
---
# 出网放行：飞书长连接与开放平台 API（open.feishu.cn 走公网 443，CDN IP 不固定，
# 故按端口放行并排除 pod 网段；DNS 由命名空间级 allow-egress-core 继续放行，
# 多条 NetworkPolicy 为并集，不影响既有 apiserver 放行）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tokenrank-allow-egress-feishu
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tokenrank
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tokenrank
  namespace: ai-pj
  labels:
    app.kubernetes.io/name: tokenrank
  annotations:
    # 对照集群里 vls-lite-ssl 的写法：DNS-01 由 DNSPod webhook 校验，证书自动签发与续期
    cert-manager.io/cluster-issuer: dnspod-cert-manager-webhook-dnspod-cluster-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tokenrank.oortcloudsmart.com
      secretName: tokenrank-oortcloudsmart-tls
  rules:
    - host: tokenrank.oortcloudsmart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenrank
                port:
                  number: 80
